version: 2

models:
  - name: analytics_deals
    description: "1 linha por deal, estágio atual (gold)"
    columns:
      - name: deal_id
        tests: [unique, not_null]
  - name: analytics_contacts
    description: "1 linha por contato, com first/last touch (gold)"
    columns:
      - name: contact_id
        tests: [unique, not_null]
  - name: analytics_calls
    columns:
      - name: call_id
        tests: [unique, not_null]
  - name: analytics_meetings
    columns:
      - name: meeting_id
        tests: [unique, not_null]
  - name: analytics_deal_stage_hist
    description: "SCD2 de dealstage a partir do snapshot"
    columns:
      - name: deal_id
        tests: [not_null]
  - name: mart_entradas
    description: "Quem entrou no CRM, quando e por qual origem (coorte para o BI)"
    columns:
      - name: contact_id
        tests: [unique, not_null]
      - name: mes_entrada
        tests: [not_null]
  - name: analytics_companies
    columns:
      - name: company_id
        tests: [unique, not_null]
  - name: fct_activities
    description: "Calls + meetings atribuídos a contato, negócio e empresa"
    columns:
      - name: activity_id
        tests: [not_null]
      - name: engagement_type
        tests:
          - accepted_values:
              values: ['CALL', 'MEETING']
