hubspot_analytics:
  target: lake
  outputs:

    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/analytics.duckdb') }}"
      threads: 4

    lake:
      type: duckdb
      path: "ducklake:{{ env_var('DUCKLAKE_CATALOG', 'data/lake_catalog.ducklake') }}"
      extensions:
        - ducklake
      threads: 1